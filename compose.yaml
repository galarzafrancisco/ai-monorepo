services:
  postgres:
    # PostgreSQL 16 with the pgvector extension, which semantic search needs.
    # The same image runs in CI and in production.
    image: pgvector/pgvector:0.8.7-pg16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: taico
      POSTGRES_USER: taico
      POSTGRES_PASSWORD: taico
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Not the volume the Alpine image used: a data directory created there must not be
      # opened by this Debian image (different text sort order). See docs/how-to-guides/search.md.
      - taico-pgvector-data:/var/lib/postgresql/data
      - ./dev/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taico -d taico"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  taico-pgvector-data:
