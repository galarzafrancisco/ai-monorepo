name: Build and Deploy

on:
  pull_request:
    branches:
      - main
      - feature/**
  push:
    branches:
      - main
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*'

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-24.04-arm

    services:
      postgres:
        # PostgreSQL 16 with the pgvector extension, which semantic search needs.
        image: pgvector/pgvector:0.8.7-pg16-bookworm
        env:
          POSTGRES_DB: taico_ci
          POSTGRES_USER: taico
          POSTGRES_PASSWORD: taico_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taico -d taico_ci"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://taico:taico_ci@127.0.0.1:5432/taico_ci
      POSTGRES_ADMIN_URL: postgresql://taico:taico_ci@127.0.0.1:5432/postgres
      TYPEORM_SCHEMA_MODE: migrate

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Restore nx cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-

      - name: Build everything (cached via nx)
        run: npm run build:prod

      - name: Generate OpenAPI against PostgreSQL
        run: npm -w apps/backend run generate:openapi

      - name: Run openapi-sdkgen tests
        run: npx nx run @taico/openapi-sdkgen:test

      - name: Run worker unit tests
        run: npm -w apps/worker run test:unit

      - name: Run E2E tests
        id: tests
        run: npm -w apps/backend run test:e2e

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: apps/backend/test-results/
          retention-days: 30
          if-no-files-found: ignore

      - name: Show logs on failure
        if: failure() && steps.tests.outcome == 'failure'
        run: |
          echo "==================================="
          echo "Test execution failed!"
          echo "==================================="
          echo ""
          echo "Check the test output above for details."
          echo "You can also download the test-results artifact for more information."

  # The image builds alongside the tests instead of after them. This job never
  # pushes: it only warms the BuildKit cache, so the push job below rebuilds
  # from cache in seconds once the tests have passed. It also runs on PRs, so
  # a broken Dockerfile or image build fails before merge, not after.
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-24.04-arm
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Pushes only when the tests AND the image build both passed. Every layer is
  # already in the cache from docker-build; if the cache was evicted this does
  # a full build instead, which is slower but still correct.
  docker:
    name: Push Docker Image
    runs-on: ubuntu-24.04-arm
    needs: [test, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.source.branch=${{ github.ref_name }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  docker-release-tag:
    name: Tag existing image with release tag
    runs-on: ubuntu-24.04-arm
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute source image tag
        id: vars
        run: |
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          echo "release_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "source_tag=main-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Promote existing image to release tag
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/${{ github.repository }}:${{ steps.vars.outputs.release_tag }} \
            ghcr.io/${{ github.repository }}:${{ steps.vars.outputs.source_tag }}

  deploy-pr:
    name: Deploy main to live or release to production
    runs-on: ubuntu-24.04-arm
    needs: [docker, docker-release-tag]
    if: >-
      always() && github.event_name == 'push' &&
      ((github.ref == 'refs/heads/main' && needs.docker.result == 'success') ||
       (startsWith(github.ref, 'refs/tags/') && needs.docker-release-tag.result == 'success'))
    # Serialize deploys so two runs never mutate spark-ops at the same time.
    concurrency:
      group: deploy-spark-ops
      cancel-in-progress: false
    permissions:
      contents: read

    steps:
      - name: Checkout ai-monorepo
        uses: actions/checkout@v5
        with:
          path: ai-monorepo

      - name: Checkout spark-ops
        uses: actions/checkout@v5
        with:
          repository: galarzafrancisco/spark-ops
          token: ${{ secrets.SPARK_OPS_TOKEN }}
          path: spark-ops

      - name: Select deployment target and image
        id: image-tag
        run: |
          set -euo pipefail
          SHORT_SHA=$(git -C ai-monorepo rev-parse --short=7 HEAD)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
            SERVICE=taico
          else
            TAG="main-${SHORT_SHA}"
            SERVICE=taico-live
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "service=${SERVICE}" >> "$GITHUB_OUTPUT"

      - name: Copy main manifests to live
        if: github.ref == 'refs/heads/main'
        run: |
          rm -rf spark-ops/k8s/taico-live
          mkdir -p spark-ops/k8s/taico-live/overlays
          cp -R ai-monorepo/install/manifests/base spark-ops/k8s/taico-live/base
          cp -R ai-monorepo/install/manifests/overlays/live spark-ops/k8s/taico-live/overlays/main

      - name: Copy release manifests to production
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          rm -rf spark-ops/k8s/taico
          mkdir -p spark-ops/k8s/taico/overlays
          cp -R ai-monorepo/install/manifests/base spark-ops/k8s/taico/base
          cp -R ai-monorepo/install/manifests/overlays/main spark-ops/k8s/taico/overlays/main

      - name: Set image in copied deployment
        env:
          SERVICE: ${{ steps.image-tag.outputs.service }}
          IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
        run: |
          sed -i "s|image: ghcr.io/galarzafrancisco/ai-monorepo:.*|image: ghcr.io/galarzafrancisco/ai-monorepo:${IMAGE_TAG}|" \
            "spark-ops/k8s/${SERVICE}/base/deployment.yaml"

      - name: Skip superseded main builds
        id: current
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ "$LATEST" = "$GITHUB_SHA" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping spark-ops PR: main moved to ${LATEST} (this run is ${GITHUB_SHA})"
          fi

      - name: Create Pull Request
        if: startsWith(github.ref, 'refs/tags/') || steps.current.outputs.latest == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.SPARK_OPS_TOKEN }}
          path: spark-ops
          commit-message: |
            deploy: update ${{ steps.image-tag.outputs.service }} to ${{ steps.image-tag.outputs.tag }}

            Source: ${{ github.repository }}@${{ github.sha }}
            Build: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          branch: deploy/${{ steps.image-tag.outputs.service }}-${{ steps.image-tag.outputs.tag }}
          delete-branch: true
          title: "Deploy ${{ steps.image-tag.outputs.service }} (${{ steps.image-tag.outputs.tag }})"
          body: |
            ## Deployment Update

            **Service**: ${{ steps.image-tag.outputs.service }}
            **Image Tag**: `${{ steps.image-tag.outputs.tag }}`
            **Source Commit**: ${{ github.sha }}

            ### Changes
            - Copied this commit's manifests into `k8s/${{ steps.image-tag.outputs.service }}/`
            - Main builds update development; release tags update production
            - Updated image tag to `${{ steps.image-tag.outputs.tag }}`

            ### Build Information
            - **Build Run**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - **Image**: `ghcr.io/${{ github.repository }}:${{ steps.image-tag.outputs.tag }}`

            ---
            *spark-ops hydrates the environment configuration and merges this PR.*

          labels: |
            automated-deployment
            taico
