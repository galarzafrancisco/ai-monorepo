name: Build and Deploy

on:
  pull_request:
    branches:
      - main
      - feature/**
  push:
    branches:
      - main
  release:
    types:
      - published

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-24.04-arm

    services:
      postgres:
        # PostgreSQL 16 with the pgvector extension, which semantic search needs.
        image: pgvector/pgvector:0.8.7-pg16-bookworm
        env:
          POSTGRES_DB: taico_ci
          POSTGRES_USER: taico
          POSTGRES_PASSWORD: taico_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taico -d taico_ci"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://taico:taico_ci@127.0.0.1:5432/taico_ci
      POSTGRES_ADMIN_URL: postgresql://taico:taico_ci@127.0.0.1:5432/postgres
      TYPEORM_SCHEMA_MODE: migrate

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Restore nx cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-

      - name: Build everything (cached via nx)
        run: npm run build:prod

      - name: Generate OpenAPI against PostgreSQL
        run: npm -w apps/backend run generate:openapi

      - name: Run openapi-sdkgen tests
        run: npx nx run @taico/openapi-sdkgen:test

      - name: Run worker unit tests
        run: npm -w apps/worker run test:unit

      - name: Run E2E tests
        id: tests
        run: npm -w apps/backend run test:e2e

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: apps/backend/test-results/
          retention-days: 30
          if-no-files-found: ignore

      - name: Show logs on failure
        if: failure() && steps.tests.outcome == 'failure'
        run: |
          echo "==================================="
          echo "Test execution failed!"
          echo "==================================="
          echo ""
          echo "Check the test output above for details."
          echo "You can also download the test-results artifact for more information."

  # The image builds alongside the tests instead of after them. This job never
  # pushes: it only warms the BuildKit cache, so the push job below rebuilds
  # from cache in seconds once the tests have passed.
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-24.04-arm
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Pushes only when the tests AND the image build both passed. Every layer is
  # already in the cache from docker-build; if the cache was evicted this does
  # a full build instead, which is slower but still correct.
  docker:
    name: Push Docker Image
    runs-on: ubuntu-24.04-arm
    needs: [test, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.source.branch=${{ github.ref_name }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  docker-release-tag:
    name: Tag existing image with release tag
    runs-on: ubuntu-24.04-arm
    needs: test
    if: github.event_name == 'release'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute source image tag
        id: vars
        run: |
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          echo "source_tag=main-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Promote existing image to release tag
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/${{ github.repository }}:${{ steps.vars.outputs.release_tag }} \
            ghcr.io/${{ github.repository }}:${{ steps.vars.outputs.source_tag }}

  deploy-pr:
    name: Copy Manifests to spark-ops
    runs-on: ubuntu-24.04-arm
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Serialize deploys so two runs never mutate spark-ops at the same time.
    concurrency:
      group: deploy-spark-ops
      cancel-in-progress: false
    permissions:
      contents: read

    steps:
      - name: Check this commit is still the latest on main
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # If another PR merged while we were building, only the newest
          # commit's run should update spark-ops, so skip the stale ones.
          LATEST=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ "$LATEST" = "$GITHUB_SHA" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deploy: main moved to ${LATEST} (this run is ${GITHUB_SHA})"
          fi

      - name: Checkout ai-monorepo
        if: steps.current.outputs.latest == 'true'
        uses: actions/checkout@v5
        with:
          path: ai-monorepo

      - name: Checkout spark-ops
        if: steps.current.outputs.latest == 'true'
        uses: actions/checkout@v5
        with:
          repository: galarzafrancisco/spark-ops
          token: ${{ secrets.SPARK_OPS_TOKEN }}
          path: spark-ops

      - name: Setup Kustomize
        if: steps.current.outputs.latest == 'true'
        uses: imranismail/setup-kustomize@v2

      - name: Extract image tag
        if: steps.current.outputs.latest == 'true'
        id: image-tag
        run: |
          SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)
          TAG="main-${SHORT_SHA}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Copy manifests to spark-ops
        if: steps.current.outputs.latest == 'true'
        run: |
          # Remove old manifests if they exist
          rm -rf spark-ops/k8s/taico

          # Copy entire manifests directory
          mkdir -p spark-ops/k8s
          cp -r ai-monorepo/install/manifests spark-ops/k8s/taico

          # Update image tag in deployment.yaml
          cd spark-ops/k8s/taico/base

          # Use kustomize to set image tag
          kustomize edit set image ghcr.io/galarzafrancisco/ai-monorepo=ghcr.io/galarzafrancisco/ai-monorepo:${{ steps.image-tag.outputs.tag }}

      - name: Re-check this commit is still the latest on main (right before publishing)
        id: final
        if: steps.current.outputs.latest == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ "$LATEST" = "$GITHUB_SHA" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping spark-ops PR: main moved to ${LATEST} (this run is ${GITHUB_SHA})"
          fi

      - name: Create Pull Request
        if: steps.current.outputs.latest == 'true' && steps.final.outputs.latest == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.SPARK_OPS_TOKEN }}
          path: spark-ops
          commit-message: |
            deploy: update taico manifests and image to ${{ steps.image-tag.outputs.tag }}

            Source: ${{ github.repository }}@${{ github.sha }}
            Build: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          branch: deploy/taico-${{ steps.image-tag.outputs.sha }}
          delete-branch: true
          title: "Deploy taico (${{ steps.image-tag.outputs.tag }})"
          body: |
            ## Deployment Update

            **Service**: taico
            **Image Tag**: `${{ steps.image-tag.outputs.tag }}`
            **Source Commit**: ${{ github.sha }}

            ### Changes
            - Copied latest manifests from `install/manifests/`
            - Updated image tag to `${{ steps.image-tag.outputs.tag }}`

            ### Build Information
            - **Build Run**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - **Image**: `ghcr.io/${{ github.repository }}:${{ steps.image-tag.outputs.tag }}`

            ---
            *This PR will be automatically validated and merged by spark-ops workflow.*

          labels: |
            automated-deployment
            taico
