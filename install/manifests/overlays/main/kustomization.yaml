apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configMapGenerator:
  - name: env
    envs:
      - env.env

resources:
  - ../../base

replacements:
  # Replace STORAGE_PATH in volume hostPath
  - source:
      kind: ConfigMap
      name: env
      fieldPath: data.STORAGE_PATH
    targets:
      - select:
          kind: Deployment
          name: taico
        fieldPaths:
          - spec.template.spec.volumes.[name=data].hostPath.path
  # Replace ISSUER_URL in taico-config ConfigMap
  - source:
      kind: ConfigMap
      name: env
      fieldPath: data.ISSUER_URL
    targets:
      - select:
          kind: ConfigMap
          name: taico-config
        fieldPaths:
          - data.ISSUER_URL
  # Route PostgreSQL through the hydrated Spark host address used by other services.
  - source:
      kind: ConfigMap
      name: env
      fieldPath: data.SPARK_IP
    targets:
      - select:
          kind: EndpointSlice
          name: taico-postgres-host
        fieldPaths:
          - endpoints.0.addresses.0
