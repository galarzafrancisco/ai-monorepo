apiVersion: apps/v1
kind: Deployment
metadata:
  name: taico
  namespace: taico
  labels:
    app: taico
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: taico
  template:
    metadata:
      labels:
        app: taico
    spec:
      containers:
        - name: taico
          image: ghcr.io/galarzafrancisco/ai-monorepo:main-6a2a84c
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          # Enable Sign in with ChatGPT for this Taico deployment.
          env:
            - name: CHATGPT_SUBSCRIPTION_ENABLED
              value: "true"
          envFrom:
            - configMapRef:
                name: taico-config
            - secretRef:
                name: taico-database
            # SECRETS_ENCRYPTION_KEY. Restored from the host key file by
            # bootstrap/taico-secrets-key.sh; never committed. Not optional: a
            # missing key must stop the pod, not fall back to plaintext.
            - secretRef:
                name: taico-secrets-encryption
            # ACCESS_REQUEST_IP_HASH_KEY: HMAC key for visitor-IP hashes stored with
            # access requests. Create with:
            #   kubectl -n <ns> create secret generic taico-access-requests \
            #     --from-literal=ACCESS_REQUEST_IP_HASH_KEY="$(openssl rand -hex 32)"
            # Optional so existing clusters still start; without it a random
            # per-process key is used (hashes not comparable across restarts).
            - secretRef:
                name: taico-access-requests
                optional: true
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: data
          hostPath:
            path: PLACEHOLDER_STORAGE_PATH
            type: DirectoryOrCreate
