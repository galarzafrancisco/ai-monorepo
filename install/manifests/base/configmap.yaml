apiVersion: v1
kind: ConfigMap
metadata:
  name: taico-config
  namespace: taico
data:
  # NODE_ENV defaults to production (set in Dockerfile), no need to specify here
  BACKEND_PORT: "3000"
  ISSUER_URL: PLACEHOLDER_ISSUER_URL
  ADK_URL: PLACEHOLDER_ADK_URL
  OLLAMA_URL: PLACEHOLDER_OLLAMA_URL
  DATABASE_PATH: "/app/data/database.sqlite"
