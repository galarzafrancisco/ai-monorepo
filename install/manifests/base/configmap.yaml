apiVersion: v1
kind: ConfigMap
metadata:
  name: taico-config
  namespace: taico
data:
  # NODE_ENV defaults to production (no need to set explicitly)
  BACKEND_PORT: "3000"
  SECRETS_ENABLED: "true"
  ISSUER_URL: PLACEHOLDER_ISSUER_URL
  DATABASE_SSL: "false"
  # Number of trusted proxy hops (ingress) in front of the backend; required so the
  # public access-request rate limit sees real client IPs instead of the ingress IP.
  TRUST_PROXY: "1"
  TYPEORM_SCHEMA_MODE: "migrate"
  GOOGLE_GENAI_USE_VERTEXAI: "True"
  GOOGLE_CLOUD_PROJECT: "placeholder"
  GOOGLE_CLOUD_LOCATION: "placeholder"
  GOOGLE_APPLICATION_CREDENTIALS: "/placeholder/foo.json"
