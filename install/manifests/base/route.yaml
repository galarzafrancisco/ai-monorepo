apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: taico
  namespace: taico
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: taico
      sectionName: https
  hostnames:
    - taico.app
  rules:
    # Public, unauthenticated /join form submission. Named so the
    # AgentgatewayPolicy in rate-limit.yaml can target just this rule.
    - name: access-requests-submit
      matches:
        - path:
            type: Exact
            value: /api/v1/access-requests
          method: POST
      backendRefs:
        - name: taico
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: taico
          port: 80
